<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-vector stats · correlation quality</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  body{background:#f5f7fc;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}
  .container{max-width:1500px;width:100%;background:#fff;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.08);padding:28px 32px}
  h1{font-size:2rem;font-weight:600;margin:0 0 .25rem;color:#1e2b3c;letter-spacing:-.02em}
  .subhead{color:#5e6f8d;margin-bottom:24px;border-left:4px solid #3b82f6;padding-left:14px}
  .input-panel{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:24px}
  .textarea-group{flex:1 1 260px;display:flex;flex-direction:column}
  .textarea-group label{font-size:.9rem;font-weight:600;color:#2c3e50;margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .badge-x{background:#3b82f6;color:#fff;padding:2px 10px;border-radius:30px;font-size:.75rem}
  .badge-y{background:#10b981;color:#fff;padding:2px 10px;border-radius:30px;font-size:.75rem}
  .badge-z{background:#f59e0b;color:#fff;padding:2px 10px;border-radius:30px;font-size:.75rem}
  textarea{font-family:'SF Mono','Fira Code',monospace;font-size:.9rem;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:16px;background:#fafcff;resize:vertical;min-height:100px}
  textarea:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
  .action-bar{display:flex;gap:12px;margin:8px 0 24px;flex-wrap:wrap}
  button{background:#1e2b3c;color:#fff;border:none;padding:12px 28px;border-radius:40px;font-weight:500;font-size:1rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.2s}
  button:hover{background:#2d3f54;transform:scale(1.01)}
  button.secondary{background:#eef2f6;color:#1e2b3c}
  button.toggle{background:#fff;color:#1e2b3c;border:1.5px solid #d0dae8;padding:8px 18px;font-size:.9rem}
  button.toggle.active{background:#1e2b3c;color:#fff;border-color:#1e2b3c}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}
  .stat-card{background:#f9fbfe;border-radius:20px;padding:18px 20px;border:1px solid #e9eef3}
  .stat-card h3{margin:0 0 12px;font-size:1.15rem;font-weight:600;display:flex;gap:8px;align-items:center}
  .stat-table{width:100%;border-collapse:collapse;font-size:.88rem}
  .stat-table td{padding:5px 0;border-bottom:1px dashed #dbe2ea}
  .stat-table td:last-child{text-align:right;font-weight:600;font-family:'SF Mono',monospace}
  .graph-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
  .graph-card{background:#fff;border-radius:20px;padding:16px 18px;border:1px solid #e9eef3;box-shadow:0 8px 20px -8px rgba(0,0,0,.1)}
  .graph-card h4{margin:0 0 12px;font-weight:600;color:#1e2b3c;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .canvas-container{position:relative;height:210px;width:100%}
  .corr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
  .corr-item{background:#f2f6fd;border-radius:16px;padding:14px 16px;text-align:center;font-weight:500}
  .corr-value{font-size:1.7rem;font-weight:700;font-family:'SF Mono',monospace;color:#1e2b3c;line-height:1.2}
  .corr-sub{font-size:.72rem;color:#5e6f8d;margin-top:4px;line-height:1.4}
  .corr-label{display:inline-block;padding:2px 10px;border-radius:30px;font-size:.7rem;font-weight:600;margin-top:6px}
  .lbl-good{background:#dcfce7;color:#166534}
  .lbl-mid{background:#fef9c3;color:#854d0e}
  .lbl-poor{background:#fee2e2;color:#991b1b}
  .fit-summary{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.88rem;background:#f0f5fe;padding:12px 16px;border-radius:16px}
  .footer-note{font-size:.8rem;color:#7b8aa3;text-align:center;margin-top:20px;border-top:1px solid #e2e8f0;padding-top:18px}
  .error-msg{background:#fee2e2;color:#b91c1c;padding:10px 16px;border-radius:30px;font-weight:500;display:inline-block;margin-bottom:16px}
  .scatter-toggle-group{display:flex;gap:6px;flex-wrap:wrap}
  .corr-big{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;background:#f8fafd;border-radius:16px;padding:14px 18px;border:1px solid #e2eaf2}
  .corr-big .item{min-width:120px}
  .corr-big .num{font-size:1.5rem;font-weight:700;font-family:'SF Mono',monospace;color:#1e2b3c}
  .corr-big .cap{font-size:.72rem;color:#5e6f8d}
</style>
</head>
<body>
<div class="container">
  <h1>📊 Three-Vector Statistical Lab</h1>
  <div class="subhead">Correlation quality: r, R², p-value, strength label &amp; switchable scatter (X-Y, X-Z, Y-Z)</div>

  <div class="input-panel">
    <div class="textarea-group"><label><span class="badge-x">X</span> data</label>
      <textarea id="inputX">2.1, 3.4, 3.9, 4.8, 5.2, 6.1, 7.0, 7.9, 8.3, 9.5</textarea></div>
    <div class="textarea-group"><label><span class="badge-y">Y</span> data</label>
      <textarea id="inputY">1.8, 2.9, 3.7, 4.1, 5.6, 6.3, 7.2, 8.1, 9.0, 10.2</textarea></div>
    <div class="textarea-group"><label><span class="badge-z">Z</span> data</label>
      <textarea id="inputZ">3.3, 4.2, 5.8, 6.1, 7.4, 8.8, 9.9, 11.0, 12.2, 13.5</textarea></div>
  </div>

  <div class="action-bar">
    <button id="analyzeBtn">🔍 Analyze</button>
    <button class="secondary" id="sampleBtn">📋 Sample (strong)</button>
    <button class="secondary" id="weakBtn">📉 Weak / noisy</button>
    <button class="secondary" id="tinyBtn">🧪 n=5 (5,6,7,2,1)</button>
  </div>
  <div id="errorContainer" style="display:none" class="error-msg"></div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="graph-grid">
    <div class="graph-card"><h4>📈 Histogram (X, Y, Z)</h4>
      <div class="canvas-container"><canvas id="histCanvas"></canvas></div>
      <div class="fit-summary" id="normalFitSummary"></div></div>
    <div class="graph-card"><h4>🔵 Scatter + correlation quality
      <span class="scatter-toggle-group">
        <button class="toggle active" data-pair="XY">X vs Y</button>
        <button class="toggle" data-pair="XZ">X vs Z</button>
        <button class="toggle" data-pair="YZ">Y vs Z</button>
      </span></h4>
      <div class="canvas-container"><canvas id="scatterCanvas"></canvas></div>
      <div class="corr-big" id="corrBig"></div>
      <div class="corr-grid" id="corrGrid"></div></div>
  </div>

  <div class="footer-note">r = Pearson · R² = r² · p from two-tailed t-test · labels follow |r| thresholds</div>
</div>

<script>
(function(){
  // ---------- DOM ----------
  const inputX=document.getElementById('inputX'),inputY=document.getElementById('inputY'),inputZ=document.getElementById('inputZ');
  const analyzeBtn=document.getElementById('analyzeBtn'),sampleBtn=document.getElementById('sampleBtn'),weakBtn=document.getElementById('weakBtn'),tinyBtn=document.getElementById('tinyBtn');
  const errorContainer=document.getElementById('errorContainer');
  const statsGrid=document.getElementById('statsGrid'),normalFitSummary=document.getElementById('normalFitSummary');
  const corrGrid=document.getElementById('corrGrid'),corrBig=document.getElementById('corrBig');
  const scatterButtons=document.querySelectorAll('.toggle');
  let histChart=null,scatterChart=null,currentScatterPair='XY';

  // ---------- helpers ----------
  function parseVector(s){if(!s.trim())return[];return s.split(/[\s,;]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n));}
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
  function stdev(a,pop=false){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((x,v)=>x+(v-m)**2,0)/(pop?a.length:a.length-1));}
  const vmin=a=>a.length?Math.min(...a):0,vmax=a=>a.length?Math.max(...a):0;

  function pearson(a,b){
    const n=Math.min(a.length,b.length);
    if(n<2)return{r:0,n:0};
    const A=a.slice(0,n),B=b.slice(0,n),ma=mean(A),mb=mean(B);
    let num=0,da=0,db=0;
    for(let i=0;i<n;i++){const x=A[i]-ma,y=B[i]-mb;num+=x*y;da+=x*x;db+=y*y;}
    const r=(da&&db)?num/Math.sqrt(da*db):0;
    return{r,n};
  }

  // two-tailed p-value from t = r*sqrt(n-2)/sqrt(1-r^2), df=n-2
  // uses incomplete beta via continued fraction (regularized)
  function logBeta(a,b){return logGamma(a)+logGamma(b)-logGamma(a+b);}
  function logGamma(z){
    const g=7,cof=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-logGamma(1-z);
    z-=1;let x=cof[0];for(let i=1;i<g+2;i++)x+=cof[i]/(z+i);
    const t=z+g+0.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
  }
  function betacf(a,b,x){
    const MAXIT=200,EPS=3e-12,FPMIN=1e-30;
    const qab=a+b,qap=a+1,qam=a-1;
    let c=1,d=1-qab*x/qap;
    if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;
    let h=d;
    for(let m=1;m<=MAXIT;m++){
      const m2=2*m;
      let aa=m*(b-m)*x/((qam+m2)*(a+m2));
      d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;
      c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
      d=1/d;h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
      d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;
      c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
      d=1/d;const del=d*c;h*=del;
      if(Math.abs(del-1)<EPS)break;
    }
    return h;
  }
  function regIncBeta(a,b,x){
    if(x<=0)return 0;if(x>=1)return 1;
    const bt=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log(1-x));
    if(x<(a+1)/(a+b+2))return bt*betacf(a,b,x)/a;
    return 1-bt*betacf(b,a,1-x)/b;
  }
  function pValueFromR(r,n){
    if(n<3)return 1;
    if(Math.abs(r)>=1)return 0;
    const df=n-2;
    const t=r*Math.sqrt(df)/Math.sqrt(1-r*r);
    const x=df/(df+t*t);
    return regIncBeta(df/2,0.5,x); // two-tailed
  }

  function strengthLabel(r){
    const ar=Math.abs(r);
    if(ar>=0.9)return{lbl:'Very strong',cls:'lbl-good'};
    if(ar>=0.7)return{lbl:'Strong',cls:'lbl-good'};
    if(ar>=0.5)return{lbl:'Moderate',cls:'lbl-mid'};
    if(ar>=0.3)return{lbl:'Weak',cls:'lbl-poor'};
    return{lbl:'Very weak / none',cls:'lbl-poor'};
  }

  // ---------- rendering ----------
  function analyzeAndRender(){
    const x=parseVector(inputX.value),y=parseVector(inputY.value),z=parseVector(inputZ.value);
    if(!x.length||!y.length||!z.length){showError('Each vector needs at least one number.');return;}
    hideError();
    const vectors=[{name:'X',arr:x,color:'#3b82f6'},{name:'Y',arr:y,color:'#10b981'},{name:'Z',arr:z,color:'#f59e0b'}];

    // stat cards
    statsGrid.innerHTML=vectors.map(v=>{
      const m=mean(v.arr),med=median(v.arr),sd=stdev(v.arr),sdp=stdev(v.arr,true),mn=vmin(v.arr),mx=vmax(v.arr);
      return `<div class="stat-card"><h3><span class="badge-${v.name.toLowerCase()}">${v.name}</span> (n=${v.arr.length})</h3>
      <table class="stat-table">
        <tr><td>Mean</td><td>${m.toFixed(4)}</td></tr>
        <tr><td>Median</td><td>${med.toFixed(4)}</td></tr>
        <tr><td>Stdev (sample)</td><td>${sd.toFixed(4)}</td></tr>
        <tr><td>Stdev (population)</td><td>${sdp.toFixed(4)}</td></tr>
        <tr><td>Min</td><td>${mn.toFixed(4)}</td></tr>
        <tr><td>Max</td><td>${mx.toFixed(4)}</td></tr>
      </table></div>`;
    }).join('');

    // correlation cards (all 3 pairs)
    const pairs=[['X','Y',x,y],['X','Z',x,z],['Y','Z',y,z]];
    corrGrid.innerHTML=pairs.map(([la,lb,a,b])=>{
      const {r,n}=pearson(a,b);
      const R2=r*r, p=pValueFromR(r,n), {lbl,cls}=strengthLabel(r);
      const sig=p<0.05?'<span style="color:#166534;font-weight:600">significant</span>':'<span style="color:#991b1b;font-weight:600">not significant</span>';
      return `<div class="corr-item">${la} ↔ ${lb}
        <div class="corr-value">${r.toFixed(3)}</div>
        <div class="corr-sub">R² = ${R2.toFixed(3)} · p = ${p<0.0001?'<1e-4':p.toFixed(4)} · n=${n}<br>${sig}</div>
        <span class="corr-label ${cls}">${lbl}</span></div>`;
    }).join('');

    renderScatter(x,y,z);
    drawHistogram(x,y,z);
  }

  function drawHistogram(x,y,z){
    const all=[...x,...y,...z],gMin=Math.min(...all),gMax=Math.max(...all),nb=8,bw=(gMax-gMin)/nb||1;
    const edges=Array.from({length:nb+1},(_,i)=>gMin+i*bw);edges[nb]=gMax;
    const bins=arr=>{const c=new Array(nb).fill(0);arr.forEach(v=>{let i=Math.floor((v-gMin)/bw);i=Math.max(0,Math.min(nb-1,i));c[i]++;});return c;};
    const xC=bins(x),yC=bins(y),zC=bins(z);
    const labels=edges.slice(0,-1).map((e,i)=>`${e.toFixed(1)}-${edges[i+1].toFixed(1)}`);
    if(histChart)histChart.destroy();
    histChart=new Chart(document.getElementById('histCanvas').getContext('2d'),{type:'bar',
      data:{labels,datasets:[
        {label:'X',data:xC,backgroundColor:'#3b82f680',borderColor:'#3b82f6',borderWidth:1},
        {label:'Y',data:yC,backgroundColor:'#10b98180',borderColor:'#10b981',borderWidth:1},
        {label:'Z',data:zC,backgroundColor:'#f59e0b80',borderColor:'#f59e0b',borderWidth:1}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'},tooltip:{mode:'index'}},scales:{y:{beginAtZero:true,title:{display:true,text:'Frequency'}}}}});
    const nf=[['X',x],['Y',y],['Z',z]].map(([n,a])=>`${n}: μ=${mean(a).toFixed(2)}, σ=${stdev(a,false).toFixed(2)}`).join(' · ');
    normalFitSummary.innerHTML=`📐 <strong>Normal fit (sample μ, σ):</strong> ${nf}`;
  }

  function renderScatter(x,y,z){
    let A,B,aL,bL;
    if(currentScatterPair==='XY'){A=x;B=y;aL='X';bL='Y';}
    else if(currentScatterPair==='XZ'){A=x;B=z;aL='X';bL='Z';}
    else{A=y;B=z;aL='Y';bL='Z';}

    const {r,n}=pearson(A,B);
    const R2=r*r, p=pValueFromR(r,n), {lbl,cls}=strengthLabel(r);

    // big summary under chart
    corrBig.innerHTML=`
      <div class="item"><div class="num">${r.toFixed(3)}</div><div class="cap">Pearson r</div></div>
      <div class="item"><div class="num">${R2.toFixed(3)}</div><div class="cap">R² (variance explained)</div></div>
      <div class="item"><div class="num">${p<0.0001?'<1e-4':p.toFixed(4)}</div><div class="cap">p-value (two-tailed)</div></div>
      <div class="item"><div class="num">${n}</div><div class="cap">n pairs</div></div>
      <div class="item"><span class="corr-label ${cls}">${lbl}</span><div class="cap" style="margin-top:6px">strength</div></div>
      <div class="item"><div class="cap">${p<0.05?'✅ statistically significant (α=0.05)':'⚠️ not significant at α=0.05'}</div></div>
    `;

    // points + regression line
    const m=Math.min(A.length,B.length),pts=Array.from({length:m},(_,i)=>({x:A[i],y:B[i]}));
    let slope=0,inter=0;
    if(pts.length>1){
      const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),mx=mean(xs),my=mean(ys);
      let num=0,den=0;for(let i=0;i<xs.length;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}
      slope=den?num/den:0;inter=my-slope*mx;
    }
    const xv=pts.map(p=>p.x),mnX=Math.min(...xv),mxX=Math.max(...xv);
    const line=(mnX!==mxX)?[{x:mnX,y:slope*mnX+inter},{x:mxX,y:slope*mxX+inter}]:[{x:mnX,y:mnX},{x:mnX,y:mnX}];

    if(scatterChart)scatterChart.destroy();
    scatterChart=new Chart(document.getElementById('scatterCanvas').getContext('2d'),{type:'scatter',
      data:{datasets:[
        {label:`${aL} vs ${bL}  (r=${r.toFixed(3)}, R²=${R2.toFixed(3)})`,
         data:pts,backgroundColor:'#3b82f6',pointRadius:5,pointHoverRadius:8},
        {label:`fit: y=${slope.toFixed(3)}x+${inter.toFixed(3)}`,
         data:line,type:'line',borderColor:'#f97316',borderWidth:2,borderDash:[6,4],pointRadius:0,fill:false}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},
        scales:{x:{title:{display:true,text:aL}},y:{title:{display:true,text:bL}}}}});

    // expose current correlation for the small cards too
    window.__currentCorr={r,R2,p,n,label:lbl,cls};
  }

  function setScatterPair(p){
    currentScatterPair=p;
    scatterButtons.forEach(b=>b.classList.toggle('active',b.dataset.pair===p));
    const x=parseVector(inputX.value),y=parseVector(inputY.value),z=parseVector(inputZ.value);
    if(x.length&&y.length&&z.length)renderScatter(x,y,z);
  }
  scatterButtons.forEach(b=>b.addEventListener('click',()=>setScatterPair(b.dataset.pair)));

  function showError(m){errorContainer.textContent=m;errorContainer.style.display='inline-block';}
  function hideError(){errorContainer.style.display='none';}

  function loadSample(){inputX.value='2.1, 3.4, 3.9, 4.8, 5.2, 6.1, 7.0, 7.9, 8.3, 9.5';inputY.value='1.8, 2.9, 3.7, 4.1, 5.6, 6.3, 7.2, 8.1, 9.0, 10.2';inputZ.value='3.3, 4.2, 5.8, 6.1, 7.4, 8.8, 9.9, 11.0, 12.2, 13.5';analyzeAndRender();}
  function loadWeak(){inputX.value='2.1, 3.4, 3.9, 4.8, 5.2, 6.1, 7.0, 7.9, 8.3, 9.5';inputY.value='7.2, 2.1, 9.8, 3.4, 6.6, 1.2, 8.9, 4.5, 5.1, 7.7';inputZ.value='3.3, 4.2, 5.8, 6.1, 7.4, 8.8, 9.9, 11.0, 12.2, 13.5';analyzeAndRender();}
  function loadTiny(){inputX.value='5, 6, 7, 2, 1';inputY.value='5, 6, 7, 2, 1';inputZ.value='1, 7, 5, 2, 6';analyzeAndRender();}

  window.addEventListener('load',analyzeAndRender);
  analyzeBtn.addEventListener('click',analyzeAndRender);
  sampleBtn.addEventListener('click',loadSample);
  weakBtn.addEventListener('click',loadWeak);
  tinyBtn.addEventListener('click',loadTiny);
})();
</script>
</body>
</html>
